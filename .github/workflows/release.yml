name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-tauri-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Rongyok Video Downloader HUD ${{ github.ref_name }}'
          releaseBody: |
            ## Rongyok Video Downloader HUD ${{ github.ref_name }}

            ### Highlights
            - Rust + Tauri v2 native desktop application
            - Dynamic stream URL extraction (`/watch/playseries.php`)
            - HTTP 206 Range byte resumption
            - Lossless FFmpeg stream copy concat
            - React 19 Cyberpunk HUD Interface (100% Vector SVG)

            ### Attribution
            Based on the original work by [TheerasakPing/rongyok-video-downloader](https://github.com/TheerasakPing/rongyok-video-downloader.git).
          releaseDraft: false
          prerelease: false

  build-python-executables:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build legacy Python CLI
        run: |
          pyinstaller --onefile --console --name "rongyok-cli-windows" cli.py

      - name: Upload Python CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-cli-windows
          path: dist/rongyok-cli-windows.exe
