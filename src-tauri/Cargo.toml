[package]
name = "rongyok-video-downloader"
version = "2.0.0"
description = "High-Performance Rongyok Video Downloader HUD (Rust & Tauri)"
authors = ["TheerasakPing", "Antigravity"]
edition = "2021"

[lib]
name = "rongyok_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["cookies", "stream", "json"] }
futures-util = "0.3"
regex = "1.10"
which = "6.0"
chrono = "0.4"

[profile.dev]
codegen-units = 1
incremental = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
